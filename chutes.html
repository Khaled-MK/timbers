<!-- @format -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>timbers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/master.css" />
</head>

<body class="bg-stone-50 select-none">
  <header class="w-full h-16 px-8 bg-marron flex items-center">
    <div class="h-full w-[18rem] bg-gris pl-4 rounded-l-full flex items-center">
      <img src="./imgs/glob/logo.jpg" alt="" class="h-[3.2rem] w-auto" />
    </div>
  </header>

  <section class="py-10 px-6">
    <form action="" id="chuteForm">
      <div class="text-lg poppins-regular-italic space-y-5 ">
        <div class="w-11/12">
          <input type="text" id="largeur" placeholder="Largeur" class=" w-full bg-transparent border-b-2 border-stone-300 outline-none poppins-regular-italic">
        </div>

        <div class="w-11/12">
          <input type="text" id="hauteur" placeholder="Hauteur" class="w-full bg-transparent border-b-2 border-stone-300 outline-none poppins-regular-italic">
        </div>

        <div class="w-11/12">

          <div class="flex items-center">
            <div class="container">
              <input type="checkbox" class="checkbox" id="sens">
              <label class="switch" for="sens">
                <span class="slider"></span>
              </label>
            </div>
            <p class="mx-2">
              Garder le sens
            </p>
          </div>

        </div>

        <div class="w-11/12 flex justify-center">
          <input type="submit" class="submit w-4/5 py-1 uppercase bg-gris text-white rounded-full  poppins-regular-italic select-none cursor-pointer ">
        </div>
      </div>

    </form>
    <div class="my-8 text-sm poppins-regular-italic">
      <div class="flex justify-between border-b-2 border-stone-300 ">

        <p class="w-1/6 text-left">Réf</p>
        <p class="w-1/6">Largeur</p>
        <p class="w-1/6">Hauteur</p>
        <p class="w-1/6">Qté</p>
      </div>
      <div id="resultDiv">
        <template>
          <div class="flex justify-between border-b-2 border-stone-300 text-right ">
            <p class="w-1/4 px-4">CH001</p>
            <p class="w-1/4 px-4">25</p>
            <p class="w-1/4 px-4">84</p>
            <p class="w-1/4 px-4">3</p>
          </div>
          <div class="flex justify-between border-b-2 border-stone-300 text-right ">
            <p class="w-1/4 px-4">CH002</p>
            <p class="w-1/4 px-4">25</p>
            <p class="w-1/4 px-4">84</p>
            <p class="w-1/4 px-4">3</p>
          </div>
        </template>
      </div>
    </div>
  </section>



  <script src="./js/chutes.js"></script>
</body>

</html>
