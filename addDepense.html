<body class="bg-stone-50 poppins-regular text-stone-600 select-none">

  <header class="w-full h-16 px-2 py-2 bg- flex items-center">
    <div class="h-full w-full flex justify-center items-center">
      <img src="./imgs/glob/logo-n.png" alt="" class="h-[2.4rem] w-auto" />
    </div>
  </header>

  <div>
    <h2 class="my-4 text-xl text-center poppins-semibold-italic ">DEPENSES</h2>
  </div>
  <section class="py-10 px-6">
    <form action="/addDepense" id="depenses" method="post">
      <div class="text-lg space-y-5 ">
        <div class="w-11/12">
          <input type="text" id="projet" name="projet" placeholder="Projet / Stand" class="w-full bg-transparent border-b-2 border-stone-300 outline-none poppins-regular-italic uppercase" autocomplete="off" required>
        </div>

        <div class="w-11/12">
          <input type="text" id="source" name="source" placeholder="Source" class=" w-full bg-transparent border-b-2 border-stone-300 outline-none  uppercase" autocomplete="off">
        </div>

        <div class="w-11/12">
          <input type="text" id="benefeciaire" name="benefeciaire" placeholder="Beneficiaire" class=" w-full bg-transparent border-b-2 border-stone-300 outline-none  uppercase" autocomplete="off">
        </div>

        <div class="w-11/12">
          <input type="text" id="designation" name="designation" placeholder="Designation" class=" w-full bg-transparent border-b-2 border-stone-300 outline-none  uppercase" autocomplete="off" required>
        </div>

        <div class="w-11/12">
          <input type="text" inputmode="numeric" id="montant" name="montant" placeholder="Montant" class="chiff w-full bg-transparent border-b-2 border-stone-300 outline-none  uppercase" autocomplete="off" required>
        </div>

        <div class="w-11/12">
          <label for="justif" class="w-full h-12 bg-stone-300 flex justify-center items-center gap-x-3 hover:bg-stone-200   uppercase">
            <img src="./imgs/glob/camera_1.svg" alt="" class="h-7">
            <p>
              Ajouter une pièce
            </p>
          </label>
          <input type="file" id="justif" name="justif" placeholder="" class="hidden bg-stone-500  w-full bg-transparent border-b-2 border-stone-300 outline-none ">
        </div>

        <div id="showImageDiv" class="w-11/12 flex justify-center ">
          <template>
            <div class="w-48 h-80 bg-red-600 overflow-hidden rounded-lg relative">
              <img src="./imgs/glob/exemple.jpg" alt="" class="object-cover">
              <img src="./imgs/glob/supp.svg" alt="" class="absolute top-2 right-2 w-7 h-7 shadow-md  shadow-white cursor-pointer">
            </div>
          </template>
        </div>


        <div class="w-11/12 flex justify-center">
          <input type="submit" class="submit w-4/5 py-1 uppercase bg-gris text-white rounded-full  poppins-regular-italic select-none cursor-pointer">
        </div>
      </div>

    </form>
